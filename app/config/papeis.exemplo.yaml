# =====================================================================================
# MODELO DE PAPÉIS E SQUADS  (arquivo de exemplo, 100% FICTÍCIO, versionado no git)
# =====================================================================================
#
# PARA QUE SERVE
#   Diz ao painel QUEM é cada pessoa, QUE PAPEL ela tem e EM QUAL SQUAD ela está.
#   Com isso o painel decide o que cada pessoa pode ver e quem pode alterar
#   responsável, vencimento e labels de atraso (a "auditoria").
#   O painel só LÊ este arquivo; ele nunca é editado pela tela.
#
# COMO USAR
#   1. Copie este modelo para o arquivo real (que o git ignora e nunca é commitado):
#        cp app/config/papeis.exemplo.yaml app/config/papeis.yaml
#   2. Abra o papeis.yaml e troque os nomes e usernames inventados pelos reais do time,
#      ajuste squads, papéis e datas.
#   3. NUNCA coloque nomes ou usernames reais neste arquivo de exemplo.
#
# ESTRUTURA (cada pessoa é um item da lista "pessoas")
#
#   - id: dev.alfa1         # username da pessoa no Jira (veja "ID")
#     nome: Fulano          # nome para exibição
#     papeis:               # lista de papéis; uma pessoa pode ter VÁRIOS
#       - papel: USUARIO    # obrigatório: um dos valores da seção "PAPEL"
#         squad: Alfa       # nome do grupo de pessoas (veja "SQUAD")
#         de: 2026-01-01    # opcional: início da vigência (veja "DE E ATE")
#         ate: 2026-06-30   # opcional: fim da vigência
#
# ID  (identificador ÚNICO DA PESSOA)
#   É o username que a pessoa tem no Jira Data Center, o MESMO valor que aparece no campo
#   "assignee" das issues. É por isso que o painel liga issue -> pessoa por simples igualdade.
#   NÃO é um código de cargo: o id não diz nada sobre o papel (quem muda de cargo continua
#   com o mesmo id; o cargo está em "papel").
#   Regras: minúsculas, apenas [a-z0-9._-], de 1 a 64 caracteres, sem começar com hífen.
#   Cada id é único no arquivo e NUNCA se reutiliza o id de outra pessoa, mesmo que ela saia.
#   Ids reservados (o painel recusa): dev, system, admin, root, anonymous.
#
# PAPEL  (o CARGO: define o que a pessoa enxerga)
#   Escreva exatamente assim, em maiúsculas.
#
#   papel          o que enxerga
#   -------------  ------------------------------------------------------------------
#   USUARIO        SOMENTE o próprio (as issues em que ela é o assignee).
#   SQUAD_LEADER   O próprio e os devs do seu squad. EXIGE o campo "squad".
#   COORDENADOR    Todos.
#   GERENTE        Todos. É o único que acessa a Integridade (todo acesso é auditado).
#
#   Quem pode trocar responsável, vencimento e labels de atraso de uma task (auditoria):
#     - o Reporter (PL) da task;
#     - qualquer COORDENADOR ou o GERENTE;
#     - o SQUAD_LEADER do squad em que o responsável estava naquela data.
#   Qualquer outra pessoa que altere esses campos gera alerta ou registro de auditoria.
#
# SQUAD
#   "squad" é só o NOME de um grupo de pessoas, escolhido por vocês. Não existe lista
#   fixa nem cadastro em outro lugar: o que vale é o texto escrito aqui, e duas pessoas
#   estão no mesmo squad quando o texto é idêntico (maiúsculas e minúsculas contam).
#   "Alfa" e "Beta" abaixo são nomes INVENTADOS de squads de exemplo; troque pelos
#   squads reais do time.
#   Coordenador e gerente não precisam de squad (veem todos).
#
# VÁRIOS PAPÉIS NA MESMA PESSOA
#   Uma pessoa pode ter vários papéis. Quem lidera o Alfa e também trabalha nele tem
#   DUAS entradas: USUARIO com squad Alfa (é membro) e SQUAD_LEADER com squad Alfa (lidera).
#
# DE E ATE (vigência, opcionais)
#   Datas no formato ISO aaaa-mm-dd, ambas INCLUSIVAS (o dia indicado ainda vale).
#   Sem "de" = vale desde sempre; sem "ate" = vale até hoje e adiante.
#   Servem para guardar o HISTÓRICO: quem mudou de squad e quem deixou um papel.
#   A auditoria retroativa usa a data da alteração para saber qual papel e qual squad
#   valiam naquele dia. "de" não pode ser depois de "ate" (o painel recusa o arquivo).
#   Exemplos neste arquivo:
#     - mudança de squad: uma entrada com "ate" no dia final do squad antigo e outra
#       com "de" no dia inicial do novo;
#     - papel encerrado: SQUAD_LEADER com "ate" preenchido; depois dessa data a pessoa
#       segue só com os papéis que não têm fim.
#
# ERROS COMUNS
#   Um rascunho antigo dizia que o id era "duas letras do cargo + contador" (ge-001, co-001,
#   sl-001, us-001). Isso foi um mal-entendido: o id é o username da PESSOA no Jira, igual ao
#   "assignee" das issues; o cargo vai só em "papel". Esse padrão NÃO vale mais.
#   Se o id não for o username real, as issues da pessoa não são ligadas a ela e ela não as vê.
#
# VALIDAÇÃO (o leitor é ESTRITO)
#   Chaves desconhecidas são rejeitadas e o painel não sobe. Use só os campos
#   id, nome, papeis, papel, de, ate e squad. Papel desconhecido, Squad Leader sem
#   squad, ids repetidos, ids fora do formato ou reservados e vigência invertida
#   também são recusados.
#
# CAMPOS QUE PODERÃO EXISTIR DEPOIS (ainda NÃO lidos pelo app; NÃO preencher)
#   Ideias para versões futuras. Estão só em comentário: se você os escrever de verdade
#   no arquivo, o painel vai recusá-lo.
#     email:           e-mail corporativo da pessoa
#     jira_sidia:      username da pessoa na instância Sidia, só para quem tem um
#                      username DIFERENTE do "id" lá (o "id" segue sendo o username
#                      da instância principal)
#     ativo:           true/false, para desligar sem apagar o histórico
#     observacao:      texto livre
#     competencias:    lista, por exemplo [android-17]
#     horas_semanais:  carga contratual, por exemplo 40
#     alocacao:        percentual alocado ao squad, por exemplo 100
# =====================================================================================
pessoas:
  # --- Gerente (vê todos) ---
  - id: gerente.exemplo
    nome: Gerente Ficticia
    papeis:
      - papel: GERENTE

  # --- Coordenadores (veem todos) ---
  - id: coord.um
    nome: Coordenador Ficticio Um
    papeis:
      - papel: COORDENADOR

  - id: coord.dois
    nome: Coordenador Ficticio Dois
    papeis:
      - papel: COORDENADOR

  - id: coord.tres
    nome: Coordenador Ficticio Tres
    papeis:
      - papel: COORDENADOR

  # --- Squad Leaders: cada um tem USUARIO (é membro) e SQUAD_LEADER (lidera) no mesmo squad ---
  - id: lider.alfa
    nome: Lider Alfa Ficticio
    papeis:
      - papel: USUARIO
        squad: Alfa
      - papel: SQUAD_LEADER
        squad: Alfa

  - id: lider.beta
    nome: Lider Beta Ficticia
    papeis:
      - papel: USUARIO
        squad: Beta
      - papel: SQUAD_LEADER
        squad: Beta

  # --- Usuários ---
  # Mudou de squad em 01/07/2026: Alfa até 30/06, Beta a partir de 01/07.
  - id: dev.mudou
    nome: Pessoa Mudou de Squad
    papeis:
      - papel: USUARIO
        ate: 2026-06-30
        squad: Alfa
      - papel: USUARIO
        de: 2026-07-01
        squad: Beta

  # Usuários comuns do Alfa.
  - id: dev.alfa1
    nome: Pessoa Alfa Um Ficticia
    papeis:
      - papel: USUARIO
        squad: Alfa

  - id: dev.alfa2
    nome: Pessoa Alfa Dois Ficticio
    papeis:
      - papel: USUARIO
        squad: Alfa

  # Usuária comum do Beta.
  - id: dev.beta1
    nome: Pessoa Beta Um Ficticia
    papeis:
      - papel: USUARIO
        squad: Beta

  # Foi Squad Leader do Alfa até 31/03/2026 (papel encerrado); depois segue como usuário.
  - id: ex.lider
    nome: Ex-Lider Ficticio
    papeis:
      - papel: USUARIO
        squad: Alfa
      - papel: SQUAD_LEADER
        ate: 2026-03-31
        squad: Alfa
