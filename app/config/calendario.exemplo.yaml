# Calendário de feriados (modelo; copie para calendario.yaml).
#
# feriados_fixos: data fixa (nacional, estadual, municipal); só mês e dia, valem todo ano.
# feriados_moveis: data móvel (Carnaval, Sexta-feira Santa, Corpus Christi); data completa,
#   incluídos de 2026 a 2030. Depois de 2030 é preciso estender esta lista.
# Pontos facultativos (Quarta-feira de Cinzas, 24 e 31/12) NÃO estão incluídos; adicione-os
#   se a empresa os adotar.

feriados_fixos:
  # Nacionais
  - {mes_dia: "01-01", nome: "Confraternização Universal"}
  - {mes_dia: "04-21", nome: "Tiradentes"}
  - {mes_dia: "05-01", nome: "Dia do Trabalho"}
  - {mes_dia: "09-07", nome: "Independência do Brasil"}
  - {mes_dia: "10-12", nome: "Nossa Senhora Aparecida"}
  - {mes_dia: "11-02", nome: "Finados"}
  - {mes_dia: "11-15", nome: "Proclamação da República"}
  - {mes_dia: "11-20", nome: "Dia Nacional de Zumbi e da Consciência Negra"}
  - {mes_dia: "12-25", nome: "Natal"}
  # Estadual (Amazonas)
  - {mes_dia: "09-05", nome: "Elevação do Amazonas à categoria de província"}
  # Municipais (Manaus)
  - {mes_dia: "10-24", nome: "Aniversário de Manaus"}
  - {mes_dia: "12-08", nome: "Nossa Senhora da Conceição (padroeira de Manaus)"}

