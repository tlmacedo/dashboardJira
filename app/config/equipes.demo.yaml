# Configuração do MODO DEMONSTRAÇÃO (dados fictícios). Para uso real, copie equipes.exemplo.yaml.
status_map:
  "Backlog": todo
  "A Fazer": todo
  "Em Andamento": active
  "Em Revisão": wait
  "Em Teste": active
  "Bloqueado": blocked
  "Concluído": done
  "Cancelado": done
workflow_order: ["Backlog", "A Fazer", "Em Andamento", "Em Revisão", "Em Teste", "Concluído"]
negative_resolutions: ["Cancelado", "Duplicado", "Não será feito"]
status_wip_limits: {"Em Andamento": 36, "Em Revisão": 12, "Em Teste": 9}
default_issue_hours: 6

