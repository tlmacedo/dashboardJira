# Modelo do mapa de status -> categoria (copie para status_map.yaml e ajuste ao seu workflow).
# Categorias: todo, active, wait, blocked, done.
status_map:
  "A Fazer": todo
  "Em andamento": active
  "Em revisão": wait
  "Aguardando": wait
  "Bloqueado": blocked
  "Concluído": done
  # Nomes em inglês das fixtures do Data Center (para o fluxo sync -> card funcionar em dev).
  "To Do": todo
  "In Progress": active
  "In Review": wait
  "Blocked": blocked
  "Done": done
  "Closed": done

# Sequência natural do fluxo (opcional): voltar a um status de índice menor é uma "devolução" (card Negativas).
# Todo status daqui precisa constar no mapa acima. Sem esta lista, "devolvidas" fica em 0 com aviso.
ordem: ["To Do", "In Progress", "In Review", "Done"]

# Resoluções que significam cancelamento (opcional; sem diferenciar maiúsculas): a task fecha, mas não conta
# como entrega nem entra em "no prazo". Ajuste ao vocabulário real do Jira na primeira conexão.
resolucoesNegativas: ["Won't Do", "Duplicate"]
