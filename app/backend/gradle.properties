# Memoria do build do backend. Sem isto o padrao do Gradle/Kotlin (512 MB) estoura ao compilar os testes
# ("Not enough memory to run compilation") e derruba o CI. Vale para o `./gradlew` local, para o CI (ubuntu-latest, 16 GB) e para
# quem roda com --no-daemon (o JVM unico forkado le este arquivo). Sem caminho local, sem segredo.
org.gradle.jvmargs=-Xmx3g -XX:+HeapDumpOnOutOfMemoryError
kotlin.daemon.jvmargs=-Xmx3g
