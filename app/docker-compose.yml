# Painel de Squads: painel (Ktor + SPA) e postgres.
# Uso: copie .env.example para .env, defina POSTGRES_PASSWORD e rode `docker compose up --build -d`.
name: painel  # evita colisão com outros projetos compose chamados "app"

services:
  painel:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Padrões seguros: Jira real desligado e modo desenvolvimento (sem login).
      JIRA_LIVE_ENABLED: ${JIRA_LIVE_ENABLED:-false}
      DASHBOARD_DEV_MODE: ${DASHBOARD_DEV_MODE:-true}
      # Conexão com o banco vem do ambiente; a senha não tem valor padrão.
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-painel}
      DATABASE_USER: ${POSTGRES_USER:-painel}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      # Instâncias do Jira NÃO entram por padrão. Para habilitar (com autorização), acrescente aqui,
      # sem valores no arquivo, as variáveis listadas no .env.example (instância samsung usa Bearer;
      # instância sidia usa Basic), no formato NOME: ${NOME:-}. A instância só ativa quando completa.
    # PRODUÇÃO (DASHBOARD_DEV_MODE=false): a imagem só traz os modelos .exemplo, que não bastam.
    # Os YAML reais (com pessoas) ficam fora da imagem e entram por volume SOMENTE LEITURA.
    # Descomente e ajuste os caminhos do servidor; sem papeis.yaml, calendario.yaml e status_map.yaml o painel não sobe.
    # volumes:
    #   - ./config/papeis.yaml:/app/config/papeis.yaml:ro
    #   - ./config/calendario.yaml:/app/config/calendario.yaml:ro
    #   - ./config/status_map.yaml:/app/config/status_map.yaml:ro  # copie de status_map.exemplo.yaml e ajuste aos status reais
    ports:
      # Só localhost: o modo desenvolvimento não exige login. Para produção, veja o README.
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-painel}
      POSTGRES_USER: ${POSTGRES_USER:-painel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    # Sem "ports": o banco só é alcançável pela rede interna do compose.
    volumes:
      - painel-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  painel-pg:
