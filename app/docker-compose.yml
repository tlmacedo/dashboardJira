# Painel de Squads: painel (Ktor + SPA) e postgres.
# Uso: copie .env.example para .env, defina POSTGRES_PASSWORD e rode `docker compose up --build -d`.
name: painel  # evita colisão com outros projetos compose chamados "app"

services:
  painel:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Padrões seguros: Jira real desligado e modo desenvolvimento (sem login).
      JIRA_LIVE_ENABLED: ${JIRA_LIVE_ENABLED:-false}
      DASHBOARD_DEV_MODE: ${DASHBOARD_DEV_MODE:-true}
      # Dados fictícios de demonstração (sem Jira). Só vale com DASHBOARD_DEV_MODE=true e JIRA_LIVE_ENABLED=false:
      # com produção ou com a flag do Jira ligada, o painel recusa subir.
      DASHBOARD_DEMO_DATA: ${DASHBOARD_DEMO_DATA:-false}
      # Conexão com o banco vem do ambiente; a senha não tem valor padrão.
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-painel}
      DATABASE_USER: ${POSTGRES_USER:-painel}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      # Instâncias do Jira: sem valor no arquivo, vêm do .env. Vazio = instância ausente; preencher só parte falha
      # na subida. Instância samsung usa Bearer (URL e token); sidia usa Basic (URL, usuário e token).
      JIRA_SAMSUNG_URL: ${JIRA_SAMSUNG_URL:-}
      JIRA_SAMSUNG_TOKEN: ${JIRA_SAMSUNG_TOKEN:-}
      JIRA_SIDIA_URL: ${JIRA_SIDIA_URL:-}
      JIRA_SIDIA_USER: ${JIRA_SIDIA_USER:-}
      JIRA_SIDIA_TOKEN: ${JIRA_SIDIA_TOKEN:-}
      # Sincronização periódica: vazio = padrão do código (veja o .env.example). NENHUMA liga a sincronização:
      # quem liga é só JIRA_LIVE_ENABLED=true.
      SYNC_INSTANCIAS: ${SYNC_INSTANCIAS:-}
      SYNC_INTERVALO_MIN: ${SYNC_INTERVALO_MIN:-}
      SYNC_HORA_RECONCILIACAO: ${SYNC_HORA_RECONCILIACAO:-}
      SYNC_HORA_RETENCAO: ${SYNC_HORA_RETENCAO:-}
      SYNC_MAX_ITENS: ${SYNC_MAX_ITENS:-}
      SYNC_MAX_REQUISICOES: ${SYNC_MAX_REQUISICOES:-}
      SYNC_SOBREPOSICAO_MIN: ${SYNC_SOBREPOSICAO_MIN:-}
      SYNC_FUSO_SERVIDOR: ${SYNC_FUSO_SERVIDOR:-}
      SYNC_TEMPO_MAX_MIN: ${SYNC_TEMPO_MAX_MIN:-}
      RETENTION_MONTHS: ${RETENTION_MONTHS:-}
    # Configs reais (papéis, calendário, mapa de status, dicionário de campos, fichas em cards/): a pasta app/config/
    # do host entra SOMENTE LEITURA por cima da config embutida na imagem (que só traz os modelos .exemplo).
    # Os arquivos reais com dados pessoais ficam no host, ignorados pelo git e fora da imagem (.dockerignore).
    # Em produção (DASHBOARD_DEV_MODE=false) papeis.yaml, calendario.yaml e status_map.yaml são obrigatórios.
    volumes:
      - ./config:/app/config:ro
    ports:
      # Só localhost: o modo desenvolvimento não exige login. Para produção, veja o README.
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-painel}
      POSTGRES_USER: ${POSTGRES_USER:-painel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    # Sem "ports": o banco só é alcançável pela rede interna do compose.
    volumes:
      - painel-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  painel-pg:
