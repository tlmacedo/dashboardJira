<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel de Squads — proposta B (editorial)</title>
<style>
/* PROPOSTA B: EDITORIAL / LEITURA. Protótipo descartável: dados fictícios, sem backend. */
:root{
  --bg:#FBFBF9;--surface:#FFFFFF;--text:#181818;--text2:#595959;--line:#E3E3DE;--soft:#F1F1EC;
  --primary:#1329A0;--on-primary:#FFFFFF;--accent:#772FEB;--ok:#0B7A3B;--warn:#9A5B00;--bad:#B3261E;
  --menu:transparent;--menu-text:#181818;--menu-text2:#595959;--menu-line:#E3E3DE;--menu-active:transparent;
  --s1:#1329A0;--s2:#772FEB;--s3:#B85A0B;--s4:#0B7A3B;--focus:#3333FF;
  --frame:none;--font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
[data-theme=dark]{
  --bg:#12161F;--surface:#171B26;--text:#EEF1F8;--text2:#B4BCCF;--line:#2A3040;--soft:#1D2332;
  --primary:#8FA8FF;--on-primary:#0B1030;--accent:#B9A0FF;--ok:#77FF94;--warn:#FFB74D;--bad:#FF8A80;
  --menu:transparent;--menu-text:#EEF1F8;--menu-text2:#B4BCCF;--menu-line:#2A3040;--menu-active:transparent;
  --s1:#8FA8FF;--s2:#B9A0FF;--s3:#F58634;--s4:#77FF94;--focus:#8FA8FF;
}
[data-theme=sidia]{
  --bg:#F6F7FF;--surface:#FFFFFF;--text:#10163A;--text2:#4A5073;--line:#D9DDF3;--soft:#ECEFFF;
  --primary:#1329A0;--menu:#1329A0;--menu-text:#FFFFFF;--menu-text2:#C9D4FF;--menu-line:#3A4DB8;--menu-active:rgba(255,255,255,.12);
  --frame:linear-gradient(90deg,#3E4095 0 25%,#00A85A 25% 50%,#F58634 50% 100%);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:16px;line-height:1.6}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.devbar{background:#B3261E;color:#fff;font-weight:600;font-size:12px;padding:5px 16px;text-align:center}
.frame{height:5px;background:var(--frame)}
.app{display:grid;grid-template-columns:232px 1fr;min-height:calc(100vh - 28px)}
.menu{background:var(--menu);color:var(--menu-text);border-right:1px solid var(--menu-line);display:flex;flex-direction:column;padding:28px 20px;gap:2px;position:sticky;top:0;height:calc(100vh - 28px);overflow:auto}
.menu .logo{padding:0 0 6px}.menu .logo img{height:32px;display:block}
.menu .prod{font-size:13px;color:var(--menu-text2);padding:0 0 18px}
.grp{font-size:12px;color:var(--menu-text2);padding:20px 0 6px;letter-spacing:.2px}
.menu a{display:block;padding:5px 0 5px 14px;color:var(--menu-text);text-decoration:none;font-size:14.5px;position:relative}
.menu a:hover{text-decoration:underline;text-underline-offset:4px}
.menu a[aria-current=page]{font-weight:650;color:var(--primary)}
.menu a[aria-current=page]:before{content:"";position:absolute;left:0;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--primary)}
[data-theme=sidia] .menu a[aria-current=page]{color:#fff}
[data-theme=sidia] .menu a[aria-current=page]:before{background:#77FF94}
.menu .foot{margin-top:auto;padding-top:20px;border-top:1px solid var(--menu-line);display:grid;gap:12px;font-size:12.5px;color:var(--menu-text2)}
.seg{display:flex;gap:14px;margin-top:4px}
.seg button{background:transparent;border:0;padding:2px 0;cursor:pointer;color:var(--menu-text2);font-size:13.5px;border-bottom:2px solid transparent}
.seg button[aria-pressed=true]{color:var(--menu-text);font-weight:650;border-bottom-color:var(--primary)}
[data-theme=sidia] .seg button[aria-pressed=true]{border-bottom-color:#77FF94}
main{padding:44px 56px 96px;min-width:0;max-width:1180px}
.top{display:block;margin-bottom:36px}
h1{font-size:38px;font-weight:600;margin:0 0 8px;letter-spacing:-.9px;line-height:1.15}
.sub{color:var(--text2);margin:0;max-width:60ch;font-size:17px}
.tools{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:20px;font-size:14px}
.tools .btn{background:none;border:0;border-bottom:1px solid var(--text2);border-radius:0;padding:0;cursor:pointer;color:var(--primary);font-weight:600}
.chip{color:var(--text2);font-size:14px}.chip:after{content:" ·";margin-left:18px}.chip:last-of-type:after{content:""}
.btn{cursor:pointer;background:none;border:0}
.btn.x{float:right;border:1px solid var(--line);border-radius:6px;padding:4px 10px}
/* KPIs: texto grande em linha, sem caixas */
.kpis{display:flex;flex-wrap:wrap;gap:0 48px;border-top:2px solid var(--primary);padding-top:20px;margin:0 0 56px}
.kpi{flex:0 1 auto;background:none;border:0;padding:0 0 12px;text-align:left;cursor:pointer;min-width:120px}
.kpi:hover .v{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}
.kpi .l{font-size:13.5px;color:var(--text2)}
.kpi .v{font-size:46px;font-weight:300;letter-spacing:-1.5px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .n{font-size:13.5px;color:var(--text2)}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.kpi .ok{color:var(--ok)}.kpi .warn{color:var(--warn)}.kpi .bad{color:var(--bad)}
.sym{font-weight:700}
.panel{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:28px 0 36px;margin:0}
.panel h2{font-size:21px;font-weight:600;margin:0 0 16px;letter-spacing:-.3px}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-weight:500;color:var(--text2);text-align:left;padding:8px 12px 8px 0;border-bottom:1px solid var(--text2);font-size:13px;position:sticky;top:0;background:var(--bg)}
td{padding:13px 12px 13px 0;border-bottom:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right;padding-right:0;font-variant-numeric:tabular-nums}
tr.row{cursor:pointer}tr.row:hover td{background:var(--soft)}
.scroll{overflow-x:auto}
.att{list-style:none;margin:0;padding:0}
.att li{border-bottom:1px solid var(--line)}
.att a{display:grid;grid-template-columns:24px 1fr auto 150px;gap:12px;align-items:baseline;padding:14px 0;color:var(--text);text-decoration:none;font-size:17px}
.att a:hover .go{text-decoration:underline}
.att .c{font-weight:600;font-size:22px;font-variant-numeric:tabular-nums}
.att .go{color:var(--primary);font-size:14px;text-align:right}
.bars{display:flex;align-items:flex-end;gap:18px;height:150px;padding-top:22px}
.bars i{flex:0 0 22px;background:var(--s1);border-radius:2px 2px 0 0;min-height:3px;position:relative}
.bars b{position:absolute;top:-20px;left:-6px;right:-6px;text-align:center;font-size:12.5px;font-weight:500;color:var(--text2)}
.axis{display:flex;gap:18px;font-size:12.5px;color:var(--text2)}.axis span{flex:0 0 22px;text-align:center;margin:0 0}
.hb{display:grid;grid-template-columns:150px 1fr 120px;gap:20px;align-items:center;padding:10px 0;font-size:15.5px}
.track{position:relative;height:3px;background:var(--line);border-radius:2px}
.track .m{position:absolute;left:0;top:-2px;height:7px;border-radius:4px;background:var(--s1)}
.track .p{position:absolute;top:-8px;bottom:-8px;width:2px;background:var(--text)}
.wait .m{background:var(--s2)}.blk .m{background:var(--s3)}
.heat td{text-align:left}
.cal td,.cal th{text-align:left}
.cal td:first-child,.cal th:first-child{width:130px}
.abs{display:block;border-bottom:2px dotted var(--text2);padding:3px 0;font-size:14px;color:var(--text2)}
.due{display:inline-block;min-width:26px;padding:0;border:0;border-bottom:2px solid var(--primary);background:none;font-weight:650;cursor:pointer;font-size:16px}
.due.bad{border-bottom-color:var(--bad)}
.hol{display:block;font-size:14px;color:var(--text2);font-style:italic}
.legend{color:var(--text2);font-size:14px;margin-top:18px;max-width:70ch}
.notice{border-left:3px solid var(--primary);padding:6px 16px;color:var(--text2);font-size:15px;margin:0 0 32px;max-width:70ch}
.shade{position:fixed;inset:0;background:rgba(10,14,30,.4);display:none;z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:21;transform:translateX(100%);transition:transform .18s ease;overflow:auto;padding:32px}
.open .shade{display:block}.open .drawer{transform:none}
.drawer h3{margin:0 0 6px;font-size:24px;font-weight:600}
.tl{list-style:none;margin:10px 0 0;padding:0;border-left:1px solid var(--text2)}
.tl li{padding:0 0 16px 18px;position:relative;font-size:15px}
.tl li:before{content:"";position:absolute;left:-5px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--primary)}
.tl li.bad:before{background:var(--bad)}.tl li.warn:before{background:var(--warn)}
.own{display:flex;height:6px;border-radius:3px;overflow:hidden;margin:10px 0 6px}.own i{display:block}
@media(prefers-reduced-motion:reduce){.drawer{transition:none}}
.burger{display:none}
@media(max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}.menu{position:relative;height:auto;padding:14px 20px;border-right:0;border-bottom:1px solid var(--menu-line)}
  .menu .prod,#nav,.menu .foot{display:none}
  .burger{display:inline-block;position:absolute;right:20px;top:18px;border:1px solid var(--menu-line);border-radius:6px;padding:4px 10px}
  body.menuopen .menu .prod,body.menuopen #nav{display:block}body.menuopen .menu .foot{display:grid}
  main{padding:28px 20px 64px}h1{font-size:30px}.kpis{gap:0 28px}.kpi .v{font-size:38px}
  .att a{grid-template-columns:22px 1fr auto}.att .go{display:none}.hb{grid-template-columns:100px 1fr 80px;gap:10px}
}
</style>
</head>

function vCentral(){const t=T(),c=t.central;
 const dc=x=>S.lang==="pt"?x:x.replace(",",".");
 const k=[kpi(c.k[0],"412",S.lang==="pt"?"+8 vs. mês anterior":"+8 vs. previous month"),kpi(c.k[1],"18","▲","bad"),kpi(c.k[2],"9","▲","bad"),kpi(c.k[3],dc("87,4%"),`▲ ${c.meta}`,"warn"),kpi(c.k[4],dc("91,2%"),`✓ ${c.meta}`,"ok")].join("");
 const rows=c.rows.map(r=>`<li><a href="#/${r[3]==="Auditoria"||r[3]==="Audit"?"auditoria":"central"}"><span class="sym ${r[0]}">${SYM[r[0]]}</span><span>${r[1]}</span><span class="c ${r[0]}">${r[2]}</span><span class="go">${r[3]} →</span></a></li>`).join("");
 const w=[14,18,16,21,17,19,22,18,20,23,19,21],mx=24;
 const bars=w.map(v=>`<i style="height:${v/mx*100}%"><b>${v}</b></i>`).join("");
 return head("central",c.sub)+`<div class="kpis">${k}</div><div class="two"><section class="panel"><h2>${c.att}</h2><ul class="att">${rows}</ul></section><section class="panel"><h2>${c.wk}</h2><div class="bars" role="img" aria-label="${c.wk}">${bars}</div><div class="axis">${w.map((_,i)=>`<span>S${i+1}</span>`).join("")}</div><h2 style="margin-top:20px">${c.fc}</h2><div class="hb" style="grid-template-columns:130px 1fr"><b style="white-space:nowrap">P50 · P85 · P95</b><div class="track"><div class="m" style="width:46%"></div><span class="p" style="left:62%"></span><span class="p" style="left:80%"></span></div></div><p class="sub">9 · 13 · 16 ${c.fcN}</p></section></div>`}
function vTempo(){const t=T(),c=t.tempo,f=S.unit==="util"?1:1.4,fx=n=>(n*f).toFixed(1).replace(".",",");
 const tog=`<div class="seg" style="border-color:var(--line)" role="group"><button aria-pressed="${S.unit==="util"}" data-unit="util" style="color:inherit">${c.util}</button><button aria-pressed="${S.unit!=="util"}" data-unit="corr" style="color:inherit">${c.corr}</button></div>`;
 const rows=[[c.st[0],3.2,6.1,""],[c.st[1],5.4,11,"wait"],[c.st[2],1.1,2.3,"blk"]];
 const st=rows.map(([n,m,p,cl])=>`<div class="hb ${cl}"><span>${n}</span><div class="track" role="img" aria-label="${n}: ${fx(m)} / ${fx(p)}"><div class="m" style="width:${m*f/16*100}%"></div><span class="p" style="left:${p*f/16*100}%"></span></div><span class="num">${fx(m)} · ${fx(p)} ${c.d}</span></div>`).join("");
 const cell=v=>{const x=v*f,s=x<=3?["✓","ok"]:x<=6?["●","warn"]:["▲","bad"];return `<td><span class="${s[1]}">${s[0]}</span> ${fx(v)}</td>`};
 const heat=[["Ana",2.1,4.8,0],["Bruno",2.8,7.2,3],["Carla",1.9,3.1,0],["Diego",3.4,5.2,1.4]].map(r=>`<tr><td>${r[0]}</td>${cell(r[1])}${cell(r[2])}${r[3]?cell(r[3]):"<td>—</td>"}</tr>`).join("");
 const stuck=[["TG-1103","Ana",c.st[1],9.5,5.4],["TG-1111","Bruno",c.st[2],6.0,1.1],["TG-1120","Diego",c.st[0],7.2,3.2]].map(r=>`<tr class="row" data-task="${r[0]}"><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td class="num warn">● ${fx(r[3])} ${c.d}</td><td class="num">${fx(r[4])} ${c.d}</td></tr>`).join("");
 return head("tempo",c.sub,tog)+`<div class="kpis">${kpi(c.k[0],"236","")}${kpi(c.k[1],"31%","▲","warn")}${kpi(c.k[2],"17","●","warn")}</div><section class="panel"><h2>${c.byStatus}</h2>${st}</section><div class="two"><section class="panel scroll"><h2>${c.heat}</h2><table class="heat"><thead><tr><th></th>${c.st.map(s=>`<th>${s}</th>`).join("")}</tr></thead><tbody>${heat}</tbody></table></section><section class="panel scroll"><h2>${c.stuck}</h2><table><thead><tr>${c.cols.map((x,i)=>`<th class="${i>2?"num":""}">${x}</th>`).join("")}</tr></thead><tbody>${stuck}</tbody></table></section></div>`}
function vCal(){const t=T(),c=t.cal;
 const P=[["Ana",["a","a","a","a","a"]],["Bruno",[0,0,2,0,1]],["Carla",[0,0,0,"h",0]],["Diego",[1,0,3,0,0]]];
 const body=P.map(([n,r])=>`<tr><td>${n}</td>${r.map((v,i)=>`<td>${v==="a"?`<span class="abs">${c.abs}</span>`:v==="h"?`<span class="hol">${c.hol}</span>`:v?`<button class="due ${v>=3?"bad":""}" data-cell="${n}|${c.days[i]}">${v>=3?"▲ ":""}${v}</button>`:"·"}</td>`).join("")}</tr>`).join("");
 const capr=[82,80,71,55,60].map(v=>`<td class="${v<60?"bad":v<75?"warn":"ok"}"><b>${v<60?"▲ ":v<75?"● ":"✓ "}${v}%</b></td>`).join("");
 return head("cal",c.sub,`<span class="chip">${c.week}</span>`)+`<section class="panel scroll"><table class="cal"><thead><tr><th></th>${c.days.map(d=>`<th>${d}</th>`).join("")}</tr></thead><tbody>${body}<tr><td><b>${c.cap}</b></td>${capr}</tr><tr><td><b>${c.due}</b></td>${[3,5,9,4,6].map(v=>`<td><b class="${v>=9?"bad":""}">${v>=9?"▲ ":""}${v}</b></td>`).join("")}</tr></tbody></table><p class="legend">${c.leg}</p></section>`}
function vAud(){const t=T(),a=t.aud;
 const rows=a.rows.map((r,i)=>`<tr class="row" data-aud="${i}"><td class="${r[0].length>2?"bad":"warn"} sym">${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]===0?`<span class="bad sym">✕ ${a.no}</span>`:r[4]===1?`<span class="warn sym">● ${a.yes}</span>`:a.na}</td></tr>`).join("");
 return head("auditoria",a.sub)+`<div class="notice">${a.notice}</div><div class="kpis">${kpi(a.k[0],"128","")}${kpi(a.k[1],"14","▲","bad")}${kpi(a.k[2],"9","●","warn")}${kpi(a.k[3],"7,2%","●","warn")}</div><section class="panel scroll"><table><thead><tr>${a.cols.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></section>`}
function vMeu(){const t=T(),m=t.meu;
 const q=[["TG-1210","Checklist — SM-X236B","28/10","30/10 ▲","bad"],["TG-1215","Checklist Review — SM-X236B","30/10","29/10 ✓","ok"],["TG-1221","Propagation — Android 17","03/11","02/11 ✓","ok"]].map(r=>`<tr class="row" data-task="${r[0]}"><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td class="${r[4]}">${r[3]}</td><td class="${r[4]}">${r[4]==="bad"?"▲":"✓"}</td></tr>`).join("");
 return head("meu",m.sub)+`<div class="kpis">${kpi(m.k[0],"14","")}${kpi(m.k[1],"3","●","warn")}${kpi(m.k[2],"92%","●","warn")}${kpi(m.k[3],"1","10–14/11")}</div><section class="panel scroll"><h2>${m.fila}</h2><table><thead><tr>${m.cols.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${q}</tbody></table></section><section class="panel"><h2>${m.esf}</h2><div class="kpis" style="margin:0">${kpi(m.esfK[0],"3,0","")}${kpi(m.esfK[1],"12","")}${kpi(m.esfK[2],"41 h","")}${kpi(m.esfK[3],"57","")}</div></section>`}
const vGeneric=id=>`<div class="top"><div><h1>${T().n[id]}</h1><p class="sub">${T().generic}</p></div></div>`;
function drawer(html){$("#drawer").innerHTML=`<button class="btn x" id="close" aria-label="Fechar">✕</button>${html}`;document.body.classList.add("open");$("#close").onclick=closeD;$("#close").focus()}
function closeD(){document.body.classList.remove("open")}
function taskDrawer(k){const a=T().aud;drawer(`<h3 id="dtitle">${k}</h3><p class="sub">Checklist — SM-X236B · Android 17</p><h4>${a.hist}</h4><ul class="tl"><li>20/10 09:12 · created by pl.diego</li><li>21/10 14:03 · assignee → dev.ana (pl.diego ✓)</li><li class="bad">27/10 17:40 · due 28/10 → 30/10 (dev.ana ✕)</li><li class="warn">28/10 08:05 · label LATE_SENT added (dev.ana)</li></ul><h4>${a.own}</h4><div class="own" role="img" aria-label="ownership"><i style="width:35%;background:var(--s2)"></i><i style="width:65%;background:var(--s1)"></i></div><div class="sub">pl.diego 2 d · dev.ana 4 d</div>`)}
function render(){chrome();const id=route();const m=$("#main");
 if(!allowed(id)){m.innerHTML=`<div class="top"><div><h1>${T().n[id]||id}</h1><p class="sub">🔒 ${S.lang==="pt"?"Sem permissão para este papel.":"Not available for this role."}</p></div></div>`;return}
 const V={central:vCentral,squad:vCentral,tempo:vTempo,cal:vCal,auditoria:vAud,meu:vMeu};
 m.innerHTML=(V[id]||(()=>vGeneric(id)))();
 m.querySelectorAll("[data-unit]").forEach(b=>b.onclick=()=>{S.unit=b.dataset.unit;save();render()});
 m.querySelectorAll("[data-task]").forEach(r=>r.onclick=()=>taskDrawer(r.dataset.task));
 m.querySelectorAll("[data-aud]").forEach(r=>r.onclick=()=>taskDrawer(T().aud.rows[r.dataset.aud][2]));
 m.querySelectorAll("[data-cell]").forEach(b=>b.onclick=()=>{const[n,d]=b.dataset.cell.split("|");drawer(`<h3 id="dtitle">${n} · ${d}</h3><p class="sub">${S.lang==="pt"?"Tasks que vencem, quem pode cobrir e horas a replanejar.":"Tasks due, who can cover and hours to replan."}</p><table><tbody><tr><td>TG-1210</td><td>Checklist</td><td class="bad">▲ 8 h</td></tr><tr><td>TG-1233</td><td>Review</td><td>3 h</td></tr></tbody></table><p class="sub">${S.lang==="pt"?"Cobertura sugerida: Carla (folga 22%, competência Android 17).":"Suggested cover: Carla (22% slack, Android 17 skill)."}</p>`)});
 m.querySelectorAll("button.kpi").forEach(b=>b.onclick=()=>drawer(`<h3 id="dtitle">${b.dataset.drill}</h3><p class="sub">${T().see} — ${S.lang==="pt"?"janela, nova aba e CSV, com a coluna Detalhe.":"window, new tab and CSV, with a Detail column."}</p>`))}
$("#burger").onclick=()=>{const o=document.body.classList.toggle("menuopen");$("#burger").setAttribute("aria-expanded",o)};
$("#shade").onclick=closeD;document.addEventListener("keydown",e=>{if(e.key==="Escape")closeD()});
addEventListener("hashchange",()=>{closeD();render()});render();
</script>
</body>
